analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
  errors:
    # Flutter 3.47+ deprecates package:flutter/material.dart in favour of the separate
    # material_ui package. We stay on material.dart so older stable SDKs keep working;
    # migrate once the team's minimum Flutter version is >= 3.47 (see docs/TOOLCHAIN.md).
    deprecated_member_use: ignore
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
