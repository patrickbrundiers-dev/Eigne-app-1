name: Build apps

# Windows installer + portable zip and Android APK.
# Runs when the client changes on main, when a PR touches the build setup, and on demand
# (Actions tab -> "Build apps" -> Run workflow). A manual run with "release_tag" (e.g. mydiet-v0.1.0)
# also publishes the files as a GitHub Release; the tag is created on the built commit.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Als GitHub Release veröffentlichen, z. B. mydiet-v0.1.0 (leer = nur bauen)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/mydiet/**"
      - ".github/workflows/build-apps.yml"
  pull_request:
    paths:
      - "apps/mydiet/android/**"
      - "apps/mydiet/windows/**"
      - "apps/mydiet/pubspec.*"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/mydiet
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version
        id: version
        shell: bash
        run: |
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "MyDietAI-Windows-${{ steps.version.outputs.name }}.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.name }} /O"$PWD" windows/installer/mydiet_ai.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/mydiet/MyDietAI-Setup-*.exe
            apps/mydiet/MyDietAI-Windows-*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mydiet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version
        id: version
        run: |
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> "$GITHUB_OUTPUT"
      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK is signed with a debug key (fine for testing)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk "MyDietAI-Android-${{ steps.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mydiet/MyDietAI-Android-*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$TAG" =~ ^mydiet-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must look like mydiet-v1.2.3"; exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sattly $TAG" \
            --notes "Windows: Setup (.exe) oder portable ZIP. Android: APK direkt installieren (Installation aus unbekannten Quellen erlauben)."
