name: Build apps

# Windows installer + portable zip and Android APK.
# Runs on demand (Actions tab -> "Build apps" -> Run workflow), on version tags (v*), and when
# the client changes on main or a PR touches the build setup. Tagged builds are published as a GitHub Release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/client/**"
      - ".github/workflows/build-apps.yml"
  pull_request:
    paths:
      - "apps/client/android/**"
      - "apps/client/windows/**"
      - "apps/client/pubspec.*"
      - ".github/workflows/build-apps.yml"

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version
        id: version
        shell: bash
        run: |
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "PaperlessAI-Windows-${{ steps.version.outputs.name }}.zip"
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DAppVersion=${{ steps.version.outputs.name }} /O"$PWD" windows/installer/paperless_ai.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            apps/client/PaperlessAI-Setup-*.exe
            apps/client/PaperlessAI-Windows-*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Version
        id: version
        run: |
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> "$GITHUB_OUTPUT"
      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APK is signed with a debug key (fine for testing)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk "PaperlessAI-Android-${{ steps.version.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/client/PaperlessAI-Android-*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Paperless AI $GITHUB_REF_NAME" \
            --notes "Windows: Setup (.exe) oder portable ZIP. Android: APK direkt installieren (Installation aus unbekannten Quellen erlauben)."
