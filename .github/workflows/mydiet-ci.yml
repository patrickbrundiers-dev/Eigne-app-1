name: MyDiet CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mydiet/**"
      - ".github/workflows/mydiet-ci.yml"
  pull_request:
    paths:
      - "apps/mydiet/**"
      - ".github/workflows/mydiet-ci.yml"

concurrency:
  group: mydiet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mydiet
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Generated database code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
      - name: Schema snapshots are up to date
        run: |
          dart run drift_dev make-migrations
          git diff --exit-code -- drift_schemas test/drift
          test -z "$(git status --porcelain -- drift_schemas test/drift)"
      - name: Format
        # Generated *.g.dart files keep build_runner's own formatting.
        run: dart format --output=none --set-exit-if-changed $(git ls-files 'lib/*.dart' 'test/*.dart' 'integration_test/*.dart' | grep -v '\.g\.dart$')
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  # On-device tests on an Android emulator (integration_test/): native SQLite, file paths, plugins, app start.
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mydiet
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Integration tests on the emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/mydiet
          script: flutter test integration_test -d emulator-5554 --reporter expanded
